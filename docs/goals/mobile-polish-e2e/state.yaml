goal:
  title: "Mobile App: Full E2E Coverage + Polish"
  slug: mobile-polish-e2e
  status: active
  intent: "Покрыть всё приложение E2E-тестами Maestro, отполировать UX, исправить все баги — не останавливаемся пока всё не работает."
  oracle: "Все Maestro E2E флоу проходят зелёно на Docker Android эмуляторе против api.skatelab.ru. Нет крашей ни на одном экране."

tasks:
  - id: T001
    type: scout
    assignee: PM
    status: done
    objective: "Map all app screens and user flows. Identify crashes, bugs, UX issues. Build E2E flow inventory."
    receipt:
      result: done
      summary: "Mapped 14 screens, 6 ViewModels. Found: PermissionScreen no retry, CameraScreen no fallback, empty content on Dashboard/Sessions/Profile, API 404 bug (fixed), AppError.Unknown no detail (fixed)."

  - id: T002
    type: worker
    assignee: Worker
    status: done
    objective: "Fix PermissionScreen: add retry button when permissions denied."
    receipt:
      result: done
      summary: "Added 'Grant permissions' button with loading state. Updated strings.xml and values-ru/strings.xml. Lint fix: sorted imports."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    objective: "Fix backend /v1/sessions 500 + logout navigation bug + Maestro scroll in E2E flows."
    receipt:
      result: done
      summary: |
        1. Backend: _session_to_response wraps S3 get_object_url_async in try/except, normalizes goe_grade (empty→None). Ran pending alembic migrations (isu_code, goe_grade).
        2. Mobile: ProfileViewModel.logout() now calls sharedAuthViewModel.logout() instead of authRepository.logout() — AuthUiState updates to LoggedOut so LoginScreen doesn't redirect back to Camera.
        3. E2E: All Maestro flows updated with scroll steps for Profile screen, logout-before-login condition in login/register flows.
      changed_files:
        - "backend/app/routes/sessions.py"
        - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/profile/ProfileViewModel.kt"
        - "mobile/androidApp/src/test/java/ru/skatelab/capture/ui/profile/ProfileViewModelTest.kt"
        - "mobile/e2e/maestro/flows/*.yaml"

  - id: T004
    type: worker
    assignee: Worker
    status: active
    objective: "Build new APK with fixes, install on emulator, run full E2E suite, verify logout works."
    allowed_files:
      - "mobile/e2e/maestro/flows/*.yaml"
    verify:
      - "All Maestro E2E flows pass on Docker emulator against real backend"
      - "Logout flow navigates to login screen correctly"
    stop_if:
      - "Need changes outside E2E flow files"

  - id: T005
    type: worker
    assignee: Worker
    status: queued
    objective: "Polish UX: error states, loading states, empty states on all screens."
    allowed_files:
      - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/**/*.kt"
      - "mobile/shared/src/commonMain/kotlin/ru/skatelab/shared/state/*.kt"
    verify:
      - "No visible UX glitches during manual walkthrough"
      - "E2E flows still pass after polish"
    stop_if:
      - "Need design changes beyond current design system"
    receipt: null

  - id: T006
    type: worker
    assignee: Worker
    status: done
    objective: "Fix Sessions screen: backend /v1/sessions was returning 500 (fixed in T003)."
    receipt:
      result: done
      summary: "Root cause: missing DB columns (isu_code, goe_grade) + S3 URL gen exceptions. Fixed by alembic migration + try/except on S3 calls + goe_grade null handling."

  - id: T999
    type: judge
    assignee: Judge
    status: queued
    objective: "Audit: full E2E coverage, no crashes, polished UX. Goal complete?"
    inputs:
      - "All done task receipts"
      - "E2E test results"
      - "Manual walkthrough verification"
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Missing evidence if not complete"
    receipt: null