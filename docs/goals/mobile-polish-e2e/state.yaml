goal:
  title: "Mobile App: Full E2E Coverage + Polish"
  slug: mobile-polish-e2e
  status: active
  intent: "Покрыть всё приложение E2E-тестами Maestro, отполировать UX, исправить все баги — не останавливаемся пока всё не работает."
  oracle: "Все Maestro E2E флоу проходят зелёно на Docker Android эмуляторе против api.skatelab.ru. Нет крашей ни на одном экране."

tasks:
  - id: T001
    type: scout
    assignee: PM
    status: done
    objective: "Map all app screens and user flows. Identify crashes, bugs, UX issues. Build E2E flow inventory."
    receipt:
      result: done
      summary: "Mapped 14 screens, 6 ViewModels. Found: PermissionScreen no retry, CameraScreen no fallback, empty content on Dashboard/Sessions/Profile, API 404 bug (fixed), AppError.Unknown no detail (fixed)."

  - id: T002
    type: worker
    assignee: Worker
    status: done
    objective: "Fix PermissionScreen: add retry button when permissions denied."
    receipt:
      result: done
      summary: "Added 'Grant permissions' button with loading state. Updated strings.xml and values-ru/strings.xml. Lint fix: sorted imports."
      changed_files:
        - "mobile/androidApp/src/main/java/ru/skatelab/capture/MainActivity.kt"
        - "mobile/androidApp/src/main/res/values/strings.xml"
        - "mobile/androidApp/src/main/res/values-ru/strings.xml"

  - id: T003
    type: worker
    assignee: Worker
    status: active
    objective: "Write Maestro E2E flows: dashboard, sessions, profile, logout + fix sessions 500 error on backend."
    allowed_files:
      - "mobile/e2e/maestro/flows/*.yaml"
      - "backend/app/routes/sessions.py"
      - "backend/app/crud/sessions.py"
    verify:
      - "All Maestro flows pass on Docker emulator against real backend"
    stop_if:
      - "Need changes outside allowed files"

  - id: T004
    type: worker
    assignee: Worker
    status: queued
    objective: "Fix CameraScreen: show graceful fallback on emulator/no-camera devices."
    allowed_files:
      - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/camera/CameraScreen.kt"
      - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/camera/CameraViewModel.kt"
    verify:
      - "App doesn't crash on emulator, shows upload-only mode or placeholder"
    stop_if:
      - "Need changes outside camera UI files"
    receipt: null

  - id: T005
    type: worker
    assignee: Worker
    status: queued
    objective: "Polish UX: error states, loading states, empty states on all screens."
    allowed_files:
      - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/**/*.kt"
      - "mobile/shared/src/commonMain/kotlin/ru/skatelab/shared/state/*.kt"
    verify:
      - "No visible UX glitches during manual walkthrough"
      - "E2E flows still pass after polish"
    stop_if:
      - "Need design changes beyond current design system"
    receipt: null

  - id: T006
    type: worker
    assignee: Worker
    status: queued
    objective: "Fix Dashboard/Sessions/Profile empty states — verify API calls succeed and data displays."
    allowed_files:
      - "mobile/shared/src/commonMain/kotlin/ru/skatelab/shared/**/*.kt"
      - "mobile/androidApp/src/main/java/ru/skatelab/capture/ui/**/*.kt"
    verify:
      - "Dashboard, Sessions, Profile show content (not just empty tabs) after login"
    stop_if:
      - "Need backend changes"
    receipt: null

  - id: T999
    type: judge
    assignee: Judge
    status: queued
    objective: "Audit: full E2E coverage, no crashes, polished UX. Goal complete?"
    inputs:
      - "All done task receipts"
      - "E2E test results"
      - "Manual walkthrough verification"
    expected_output:
      - "complete | not_complete"
      - "full_outcome_complete: true | false"
      - "Missing evidence if not complete"
    receipt: null