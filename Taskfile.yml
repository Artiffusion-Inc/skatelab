# $schema: https://taskfile.dev/schema.json
version: '3'

vars:
  # Root quality commands install every workspace member from root .venv.
  UV_WORKSPACE_RUN: uv run --all-packages --frozen
  # Member commands still discover root workspace explicitly from member dirs.
  UV_BACKEND_RUN: uv run --project .. --package backend --frozen
  UV_ML_RUN: uv run --project .. --package ml --frozen
  BUNX: bunx

tasks:
  # Python tasks
  py-lint:
    desc: Check Python formatting and lint
    dir: .
    cmd: "{{.UV_WORKSPACE_RUN}} ruff format --check backend/ ml/ && {{.UV_WORKSPACE_RUN}} ruff check backend/ ml/"

  py-test:
    desc: Run pytest tests (excluding slow and integration tests)
    dir: .
    cmd: "{{.UV_WORKSPACE_RUN}} pytest backend/tests/ ml/tests/ -v -m \"not slow and not integration\" --tb=short --import-mode=importlib"

  py-typecheck:
    desc: Run basedpyright type checker on backend/app and ml/src
    dir: .
    cmd: "{{.UV_WORKSPACE_RUN}} basedpyright --level error backend/app ml/src"

  ci-audit:
    desc: Run static CI workflow and infrastructure audit checks
    dir: .
    cmd: 'set -euo pipefail; for audit in scripts/ci-audit/test_*.py; do {{.UV_WORKSPACE_RUN}} python "$audit"; done'

  py-all:
    desc: Run all Python quality checks (lint, test, typecheck)
    dir: .
    cmds:
      - task: py-lint
      - task: py-test
      - task: py-typecheck

  # Database tasks
  db-migrate:
    desc: Run database migrations (Alembic upgrade)
    dir: backend
    cmd: "{{.UV_BACKEND_RUN}} alembic upgrade head"

  db-rollback:
    desc: Rollback last database migration
    dir: backend
    cmd: "{{.UV_BACKEND_RUN}} alembic downgrade -1"

  db-reset:
    desc: Reset database (drop all, recreate, migrate)
    dir: backend
    cmds:
      - "{{.UV_BACKEND_RUN}} alembic downgrade base"
      - "{{.UV_BACKEND_RUN}} alembic upgrade head"

  db-migration:
    desc: Create a new autogenerate migration
    dir: backend
    cmd: "{{.UV_BACKEND_RUN}} alembic revision --autogenerate -m '{{.migration_name}}'"

  # Frontend tasks
  fe-lint:
    desc: Check Biome formatting and lint on frontend code
    dir: frontend
    cmd: "{{.BUNX}} biome check ."

  fe-test:
    desc: Run vitest tests
    dir: frontend
    cmd: "bun run vitest run"

  fe-typecheck:
    desc: Run TypeScript type checker
    dir: frontend
    cmd: "bun run typecheck"

  fe-build:
    desc: Build frontend for production
    dir: frontend
    cmd: "bun run build"

  fe-all:
    desc: Run all frontend quality checks and build
    dir: .
    cmds:
      - task: fe-lint
      - task: fe-test
      - task: fe-typecheck
      - task: fe-build

  # Ast-grep tasks
  sg-test:
    desc: Run ast-grep rule tests
    cmd: ast-grep test

  sg-scan:
    desc: Run ast-grep scan on all source files
    cmd: ast-grep scan

  # Unified tasks
  ci:
    desc: Run all CI checks (Python + Frontend)
    dir: .
    cmds:
      - task: sg-test
      - task: ci-audit
      - task: py-all
      - task: fe-all

  dev:
    desc: Start backend and frontend dev servers in parallel
    dir: .
    cmds:
      - task: dev-backend
      - task: dev-frontend
    parallel: true

  dev-backend:
    desc: Start Python backend dev server
    dir: backend
    cmd: "{{.UV_BACKEND_RUN}} litestar run --port 8000 --reload"

  dev-frontend:
    desc: Start frontend dev server
    dir: frontend
    cmd: "bun run dev"

  # Default task
  default:
    desc: Run all CI checks
    cmd: task ci

  # Vast.ai Serverless tasks
  vastai-presign:
    desc: Generate pre-signed S3 URLs for FP16 model embedding (requires RustFS S3 env vars)
    dir: ml
    cmds:
      - "{{.UV_ML_RUN}} python scripts/generate_model_presigned_urls.py --output /tmp/model_urls.json"
      - jq -r .moganet /tmp/model_urls.json > /tmp/moganet_url.txt
      - jq -r .rf_detr /tmp/model_urls.json > /tmp/rf_detr_url.txt
      - jq -r .tcpformer /tmp/model_urls.json > /tmp/tcpformer_url.txt

  vastai-build:
    desc: Build GPU worker image with embedded models (run vastai-presign first)
    cmds:
      - podman build
          --secret id=moganet_url,src=/tmp/moganet_url.txt
          --secret id=rf_detr_url,src=/tmp/rf_detr_url.txt
          --secret id=tcpformer_url,src=/tmp/tcpformer_url.txt
          -f ml/gpu_server/Containerfile
          -t ghcr.io/Artiffusion-Inc/skatelab-worker:latest
          .

  vastai-push:
    desc: Push GPU worker image to ghcr.io
    cmd: podman push ghcr.io/Artiffusion-Inc/skatelab-worker:latest

  vastai-deploy:
    desc: Generate URLs, build and push GPU worker image
    cmds:
      - task: vastai-presign
      - task: vastai-build
      - task: vastai-push

  # CLI tasks
  cli-login:
    desc: Authenticate CLI with backend
    dir: ml
    cmds:
      - "{{.UV_ML_RUN}} python scripts/cli.py login"

  cli-analyze:
    desc: Analyze a video using remote GPU (set VIDEO and ELEMENT vars)
    dir: ml
    cmds:
      - "{{.UV_ML_RUN}} python scripts/cli.py analyze {{.VIDEO}} --element {{.ELEMENT}}"
    vars:
      VIDEO: '{{.VIDEO | default "data/samples/test.mp4"}}'
      ELEMENT: '{{.ELEMENT | default "waltz_jump"}}'

  # Design system tasks (v2 — LLM-based generation)
  design:build:
    desc: "Generate design tokens for all platforms from DESIGN.md via LLM"
    cmd: node scripts/design-build.js

  design:lint:
    desc: "UI anti-pattern scan (impeccable + ast-grep)"
    cmds:
      - npx impeccable detect --fast --json frontend/src/ 2>&1 | node scripts/impeccable-report.js
      - ast-grep scan

  design:check:
    desc: "Full design validation (build + WCAG + drift)"
    cmds:
      - task: design:build
      - node scripts/design-wcag.js
      - node scripts/design-lock.js check

  design:lock:
    desc: "Update checksum lockfile after reviewing generated changes"
    cmd: node scripts/design-lock.js update

  design:wcag:
    desc: "WCAG contrast ratio validation"
    cmd: node scripts/design-wcag.js

  design:audit:
    desc: "Deep design quality audit (manual/scheduled only, requires LLM)"
    cmd: claude -p "hallmark audit frontend/src/ using DESIGN.md as design system" --bare --output-format json --max-turns 5
