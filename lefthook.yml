# $schema: https://raw.githubusercontent.com/evilmartians/lefthook/master/schema.json
# Lefthook configuration for skatelab
assert_lefthook_installed: true
colors: true
output:
  - execution
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: protect-branches
      run: |
        BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null)
        case "$BRANCH" in
          main|master|develop)
            echo "❌ Direct commits to '$BRANCH' are not allowed."
            echo "Please use a feature/hotfix/release branch."
            exit 1
            ;;
        esac
        GIT_DIR=$(git rev-parse --git-dir)
        GIT_COMMON_DIR=$(git rev-parse --git-common-dir)
        if [ "$GIT_DIR" = "$GIT_COMMON_DIR" ]; then
          echo "❌ Commits must be made from a git worktree, not the main working tree."
          echo "   Use EnterWorktree tool or: git worktree add ../<name> -b <branch>"
          exit 1
        fi

    - name: ruff
      glob: "*.py"
      exclude:
        - "*/alembic/versions/*"
      tags:
        - backend
        - lint
      group:
        piped: true
        jobs:
          - name: ruff-check
            run: uv run ruff check {staged_files} --fix
            stage_fixed: true
          - name: ruff-format
            run: uv run ruff format {staged_files}
            stage_fixed: true

    - name: biome-check
      glob: "frontend/**/*.{ts,tsx,js,jsx,json,css}"
      tags:
        - frontend
        - lint
      run: bunx biome check --write {staged_files}
      stage_fixed: true

    - name: ktlint-format
      root: "mobile/"
      glob: "*.{kt,kts}"
      tags:
        - mobile
        - lint
      run: ./gradlew ktlintFormat 2>&1 | tail -5
      stage_fixed: true

    - name: ast-grep-scan
      tags:
        - lint
      run: |
        if ! command -v sg >/dev/null 2>&1; then
          exit 0
        fi
        sg scan -c sgconfig.yml backend/ ml/ frontend/ mobile/ || true

commit-msg:
  commands:
    lint-commit-msg:
      run: |
        COMMIT_MSG=$(cat {1})

        if echo "$COMMIT_MSG" | grep -qE "^Merge (branch|remote-tracking branch)"; then
          exit 0
        fi

        TYPES=$(grep '^types:' .commit-conventions | cut -d: -f2)
        SCOPES=$(grep '^scopes:' .commit-conventions | cut -d: -f2)
        SCOPE_REQUIRED=$(grep '^scope_required:' .commit-conventions | cut -d: -f2)
        if [ "$SCOPE_REQUIRED" = "false" ]; then
          PATTERN="^(${TYPES})(\(([a-z0-9_-]+)\))?: .{3,}$"
        else
          PATTERN="^(${TYPES})\(([a-z0-9_-]+)\): .{3,}$"
        fi

        if ! echo "$COMMIT_MSG" | grep -Eq "$PATTERN"; then
          echo "❌ Bad commit message:"
          echo "   $COMMIT_MSG"
          echo ""
          echo "✅ Use: type(scope): summary"
          echo "   Types: feat, fix, refactor, chore, docs, test, ci"
          echo "   e.g. feat(pose): add MotionAGFormer integration"
          echo "        fix(aligner): correct DTW window calculation"
          exit 1
        fi

pre-push:
  parallel: false
  skip:
    - rebase
  commands:
    warn-pr-size:
      run: |
        REMOTE_BRANCH=$(git rev-parse --abbrev-ref --symbolic-full-name @{u} 2>/dev/null | sed 's|/.*||')
        REMOTE_BRANCH=${REMOTE_BRANCH:-origin}
        DEFAULT_BRANCH=$(git remote show $REMOTE_BRANCH 2>/dev/null | grep 'HEAD branch' | cut -d' ' -f5)
        DEFAULT_BRANCH=${DEFAULT_BRANCH:-master}

        CHANGED_FILES=$(git diff --stat $DEFAULT_BRANCH...HEAD 2>/dev/null | tail -n1 | awk '{print $1}')
        ADDED_LINES=$(git diff $DEFAULT_BRANCH...HEAD --numstat 2>/dev/null | awk '{add+=$1} END {print add}')
        DELETED_LINES=$(git diff $DEFAULT_BRANCH...HEAD --numstat 2>/dev/null | awk '{del+=$2} END {print del}')
        TOTAL_LINES=$((ADDED_LINES + DELETED_LINES))

        if [ -z "$TOTAL_LINES" ] || [ "$TOTAL_LINES" -eq 0 ]; then
          exit 0
        fi

        if [ "$TOTAL_LINES" -lt 100 ]; then
          SIZE="XS"
          EMOJI="🟢"
        elif [ "$TOTAL_LINES" -lt 400 ]; then
          SIZE="S"
          EMOJI="🟢"
        elif [ "$TOTAL_LINES" -lt 1000 ]; then
          SIZE="M"
          EMOJI="🟡"
        elif [ "$TOTAL_LINES" -lt 2000 ]; then
          SIZE="L"
          EMOJI="🟠"
          echo ""
          echo "⚠️  $EMOJI Large PR detected: ~$TOTAL_LINES lines changed in $CHANGED_FILES files"
          echo "   Size category: $SIZE"
          echo ""
          echo "   Consider splitting if this addresses multiple issues."
          echo ""
        else
          SIZE="XL"
          EMOJI="🔴"
          echo ""
          echo "🚨 $EMOJI Extra-large PR: ~$TOTAL_LINES lines changed in $CHANGED_FILES files"
          echo "   Size category: $SIZE (recommended max: 2000 lines)"
          echo ""
          echo "   Please consider splitting into smaller, focused PRs."
          echo ""
          echo "   To bypass: git push --no-verify"
          echo ""
        fi

        echo "📊 PR Size: $EMOJI $SIZE (~$TOTAL_LINES lines, $CHANGED_FILES files)"

    design-lint:
      tags:
        - frontend
        - lint
      run: |
        cd frontend
        if [ -f node_modules/.bin/impeccable ] || command -v impeccable > /dev/null 2>&1; then
          impeccable detect --json src/ 2>&1 | node ../scripts/design/impeccable-report.js || true
        fi
        if command -v sg > /dev/null 2>&1; then
          sg scan -c ../sgconfig.yml frontend/ || true
        fi
        node ../scripts/design/design-lock.js check || exit 1

    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: |
        if ! command -v actionlint > /dev/null 2>&1; then
          exit 0
        fi
        actionlint -config-file .github/actionlint.yaml {staged_files}

post-merge:
  parallel: true
  only:
    - ref: master
  files: "git diff-tree -r --name-only --no-commit-id ORIG_HEAD HEAD"
  commands:
    uv-sync:
      glob: "{uv.lock,pyproject.toml,backend/pyproject.toml,ml/pyproject.toml}"
      run: uv sync
    bun-install:
      glob: "{frontend/package.json,frontend/bun.lock}"
      run: cd frontend && bun install
    alembic-migrate:
      glob: "backend/alembic/versions/*"
      run: cd backend && uv run alembic upgrade head

# Manual groups
format:
  commands:
    ruff-format:
      run: uv run ruff check backend/ ml/ --fix && uv run ruff format backend/ ml/
    biome-check:
      run: cd frontend && bunx biome check --write .

test:
  commands:
    pytest:
      run: uv run pytest backend/tests/ ml/tests/ -v -m "not slow" --tb=short
    fe-test:
      run: cd frontend && bun test --run

typecheck:
  commands:
    basedpyright:
      run: uv run basedpyright --level error backend/app ml/src
    fe-typecheck:
      run: cd frontend && bunx tsc -p tsconfig.app.json

post-push:
  commands:
    vast-deploy:
      tags: vast
      run: bash scripts/deploy.sh
      description: Deploy to active vast.ai instance after push