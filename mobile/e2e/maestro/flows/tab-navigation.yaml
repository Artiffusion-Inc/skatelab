appId: ru.skatelab.capture
tags:
  - smokeTest
  - navigation
---
# Prerequisite: user must be logged in
- launchApp
# Wait for main screen after auto-login
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000
- assertVisible: "Progress"
- tapOn: "Progress"
- assertVisible: "Upload video"
- tapOn: "Sessions"
- assertVisible: "Profile"
- tapOn: "Profile"
- assertVisible: "Log out"
- tapOn: "Camera"
- assertVisible: "Upload video"