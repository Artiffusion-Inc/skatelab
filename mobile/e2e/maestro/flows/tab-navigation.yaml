appId: ru.skatelab.capture
tags:
  - smokeTest
  - navigation
---
# Prerequisite: user must be logged in
- launchApp
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000
# Switch to Progress tab — verify user name is shown
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Hello, Test User!"
    timeout: 10000
# Switch to Sessions tab
- tapOn: "Sessions"
- assertVisible: "Profile"
# Switch to Profile tab — verify profile fields are shown
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Display name"
    timeout: 10000
# Switch back to Camera tab
- tapOn: "Camera"
- assertVisible: "Upload video"