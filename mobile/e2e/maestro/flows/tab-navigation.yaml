appId: ru.skatelab.capture
tags:
  - smokeTest
  - navigation
---
# Prerequisite: user must be logged in
- launchApp
- assertVisible: "Camera"
# Switch to Progress tab — verify user name is shown
- tapOn: "Progress"
- assertVisible: "Hello, Test User!"
# Switch to Sessions tab
- tapOn: "Sessions"
- assertVisible: "Profile"
# Switch to Profile tab — verify profile fields are shown
- tapOn: "Profile"
- assertVisible: "Display name"
# Switch back to Camera tab
- tapOn: "Camera"
- assertVisible: "Upload video"