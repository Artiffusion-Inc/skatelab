appId: ru.skatelab
tags:
  - smokeTest
  - navigation
---
- launchApp
# Camera tab is default after login
- assertVisible: "Камера"
- assertVisible: { id: "cameraRecordButton" }
# Switch to Progress tab (not "Дашборд" — actual label is "Прогресс")
- tapOn: "Прогресс"
- assertVisible: { id: "dashboardContent" }
# Switch to Profile
- tapOn: "Профиль"
- assertVisible: { id: "profileUploadQueueLink" }
# Switch to Sessions
- tapOn: "Сессии"
- assertVisible: { id: "sessionListContent" }
# Back to Camera
- tapOn: "Камера"
- assertVisible: { id: "cameraRecordButton" }