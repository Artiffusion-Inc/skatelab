appId: ru.skatelab
tags:
  - recording
---
- launchApp
- assertVisible: "Камера"
- assertNotVisible: "Подготовка камеры…"
- tapOn: { id: "cameraRecordButton" }
- assertVisible: { id: "cameraRecIndicator" }
- extendedWaitUntil:
    visible: "REC 00:0[3-9]"
    timeout: 10000
- tapOn: { id: "cameraRecordButton" }
- assertNotVisible: "REC"
- assertVisible: { id: "elementTypeSheet" }