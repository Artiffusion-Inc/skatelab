appId: ru.skatelab.capture
tags:
  - smokeTest
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# Wait for login screen
- assertVisible: "Log in to your account"
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
# After login attempt without backend: retry button should appear
- extendedWaitUntil:
    visible: "Retry"
    timeout: 10000