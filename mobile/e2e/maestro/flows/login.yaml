appId: ru.skatelab.capture
tags:
  - smokeTest
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# Wait for login screen
- assertVisible: "Log in to your account"
- tapOn:
    id: "emailField"
- inputText: test@skatelab.ru
- tapOn:
    id: "passwordField"
- inputText: Test123456
- tapOn:
    id: "loginButton"
# After login attempt: either succeeds (navigates to main screen)
# or shows network error (expected in emulator without backend)
- assertVisible:
    label: "Login response (success or network error)"
    anyOf:
      - id: "cameraRecordButton"
      - text: "network"