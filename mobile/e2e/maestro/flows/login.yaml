appId: ru.skatelab.capture
tags:
  - smokeTest
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# Wait for login screen
- assertVisible: "Log in to your account"
- tapOn:
    id: "emailField"
- inputText: test@skatelab.ru
- tapOn:
    id: "passwordField"
- inputText: Test123456
- tapOn:
    id: "loginButton"
# After login: check for network error (expected without backend)
# If no error, app navigates to main screen with cameraRecordButton
- assertVisible: "network"