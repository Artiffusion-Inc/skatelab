appId: ru.skatelab.capture
tags:
  - smokeTest
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# If already logged in, log out first
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - extendedWaitUntil:
          visible: "Log in to your account"
          timeout: 10000
# Wait for login screen
- extendedWaitUntil:
    visible: "Log in to your account"
    timeout: 10000
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
# After successful login: main tabs should appear
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000