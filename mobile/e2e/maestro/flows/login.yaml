appId: ru.skatelab
tags:
  - smokeTest
  - auth
---
- launchApp
- assertVisible: "Войдите в аккаунт"
- tapOn: "Email"
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: "Пароль"
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: { id: "loginButton" }
# After login, user lands on MainTabs (Camera tab by default)
- assertVisible: "Камера"