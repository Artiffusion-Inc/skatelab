appId: ru.skatelab.capture
tags:
  - upload
  - e2e
---
# Gallery upload E2E flow
# Prerequisites: logged in, has a video in gallery
# Tests: gallery picker → element type selection → upload → processing screen
- launchApp
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000

# Navigate to upload
- tapOn: "Upload video"

# Note: PickVisualMedia system picker cannot be automated by Maestro
# The gallery picker is a system dialog that Maestro cannot interact with
# This flow verifies the upload button exists and triggers the picker
# Full upload flow tested manually or with adb to push a test video
- assertVisible: "Upload video"