appId: ru.skatelab
tags:
  - upload
---
- launchApp
- assertVisible: "Камера"
- assertNotVisible: "Подготовка камеры…"
# Seed a test video into the device gallery
- addMedia:
    - "../resources/test_video.mp4"
- tapOn: { id: "cameraGalleryButton" }
# Navigate the system photo picker (partial flow with fallback selectors)
- runFlow: ../partials/pick_first_video.yaml
- assertVisible: { id: "elementTypeSheet" }
- tapOn: { id: "elementTypeConfirm" }