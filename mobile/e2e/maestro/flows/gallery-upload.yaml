appId: ru.skatelab.capture
tags:
  - upload
  - e2e
---
# Gallery upload E2E flow
# Prerequisites: logged in
# Uses addMedia to seed device gallery + pick_first_video partial
- addMedia: ["./assets/test_video.mp4"]
- launchApp
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000
- tapOn: "Upload video"
- runFlow: ../partials/pick_first_video.yaml
- assertVisible: "Upload video"