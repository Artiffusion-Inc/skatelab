appId: ru.skatelab.capture
tags:
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# Navigate to register screen from login
- assertVisible: "Log in to your account"
- tapOn: "Register"
- assertVisible: "Create account"
- tapOn:
    id: "displayNameField"
- inputText: Test User
- tapOn:
    id: "emailField"
- inputText: test@skatelab.ru
- tapOn:
    id: "passwordField"
- inputText: Test123456
- tapOn:
    id: "registerButton"
# After register attempt: either succeeds or shows network error
- assertVisible:
    label: "Register response (success or network error)"
    anyOf:
      - id: "cameraRecordButton"
      - text: "network"