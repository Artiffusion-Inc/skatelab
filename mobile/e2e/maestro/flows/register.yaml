appId: ru.skatelab.capture
tags:
  - smokeTest
  - auth
  - manual
---
# NOTE: This flow requires a unique email each run.
# Since Maestro cannot generate timestamps, this is a manual-only test.
# Use a fresh email like: e2e-20260609@example.com
# After registration, the new account must be verified or it may conflict with future runs.
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# If already logged in, log out first
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - assertVisible: "Log in to your account"
# Navigate to register screen from login
- assertVisible: "Log in to your account"
- tapOn: "Don't have an account? Register"
- assertVisible: "Create Account"
- tapOn: "Display name"
- inputText: E2E Test User
- back
- tapOn: "Email"
- inputText: e2e-manual-test@example.com
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Register"
# After successful registration: main tabs should appear
- assertVisible: "Camera"