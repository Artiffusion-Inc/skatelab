appId: ru.skatelab.capture
tags:
  - auth
---
- launchApp
# Grant camera permission if prompted
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
# If already logged in, log out first
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - extendedWaitUntil:
          visible: "Log in to your account"
          timeout: 10000
# Navigate to register screen from login
- extendedWaitUntil:
    visible: "Log in to your account"
    timeout: 10000
- tapOn: "Don't have an account? Register"
- assertVisible: "Create Account"
- tapOn: "Display name"
- inputText: Test User
- back
- tapOn: "Email"
- inputText: e2e-register@example.com
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Register"
# After successful registration: main tabs should appear
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000