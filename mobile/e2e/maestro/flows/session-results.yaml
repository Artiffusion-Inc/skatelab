appId: ru.skatelab.capture
tags:
  - sessions
  - e2e
---
# Verify session appears after processing
# Prerequisite: at least one completed session exists (run upload-pipeline first)
- launchApp
- assertVisible: "Camera"
- tapOn: "Sessions"
- runFlow:
    when:
      visible: "axel"
    commands:
      - assertVisible: "axel"
- assertVisible: "Profile"