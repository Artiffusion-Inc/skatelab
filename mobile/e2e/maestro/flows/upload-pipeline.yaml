appId: ru.skatelab.capture
tags:
  - smokeTest
  - upload
  - e2e
  - pipeline
---
# Full upload pipeline: addMedia → pick video → element selection → upload → processing → completed
# Starts from fresh install by logging in first, then runs the upload flow in the same Maestro session.
# This avoids dADB flakiness caused by launching multiple Maestro flows sequentially.

# --- Login prerequisite ---
- launchApp
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - assertVisible: "Log in to your account"
- assertVisible: "Log in to your account"
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
- assertVisible: "Camera"

# --- Upload pipeline ---
- addMedia: ["./assets/test_video.mp4"]
- tapOn: "Upload video"
- tapOn: "00:12"
# ISU element picker (family-grouped): "Axel" family header, then rotation variants "1A/2A/3A/4A".
# The bottom sheet only shows the top of the list; the variant rows sit below the fold, so
# scroll the sheet incrementally until "3A" is visible. Maestro tapOn matches visible text as a
# case-insensitive substring, so "3A" hits the "3A — Triple Axel" variant row.
- assertVisible: "Axel"
# The ISU picker is a Compose ModalBottomSheet whose internal scroll does not map to
# Maestro's full-screen `scrollUntilVisible` (it overshoots past the Axel family at the
# default speed). Use a low-speed coordinate swipe inside the sheet to reveal the variants
# (1A..4A), then tap "3A". The exact swipe range may need tuning per device/screen.
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 500
- assertVisible: "3A"
- tapOn: "3A"
# Confirm element selection — the new picker has a "Next" button that triggers the upload
# (the old slug picker auto-uploaded on selection; the ISU picker requires explicit confirm).
- tapOn: "Next"
- assertVisible: "Uploading video…"
- retry:
    maxRetries: 30
    commands:
      - assertVisible: "Analysis complete"
