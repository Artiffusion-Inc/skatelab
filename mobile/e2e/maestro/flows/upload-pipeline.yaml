appId: ru.skatelab.capture
tags:
  - smokeTest
  - upload
  - e2e
  - pipeline
---
# Full upload pipeline: addMedia → pick video → element selection → upload → processing → completed
# Starts from fresh install by logging in first, then runs the upload flow in the same Maestro session.
# This avoids dADB flakiness caused by launching multiple Maestro flows sequentially.

# --- Login prerequisite ---
- launchApp
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - assertVisible: "Log in to your account"
- assertVisible: "Log in to your account"
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
- assertVisible: "Camera"

# --- Upload pipeline ---
- addMedia: ["./assets/test_video.mp4"]
- tapOn: "Upload video"
- tapOn: "00:12"
# ISU element picker (family-grouped): "Axel" family header, then rotation variants "1A/2A/3A/4A".
# The bottom sheet only shows the top of the list; the variant rows sit below the fold, so
# scroll the sheet incrementally until "3A" is visible. Maestro tapOn matches visible text as a
# case-insensitive substring, so "3A" hits the "3A — Triple Axel" variant row.
- assertVisible: "Axel"
# The ISU picker is a Compose ModalBottomSheet whose internal scroll does not map to
# Maestro's full-screen `scrollUntilVisible` (it overshoots past the Axel family at the
# default speed). Use a low-speed coordinate swipe inside the sheet to reveal the variants
# (1A..4A), then tap "3A". The exact swipe range may need tuning per device/screen.
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 500
# Maestro `textRegex` matches the whole text node, not a substring, so the
# variant row text "3A — Triple Axel" is NOT matched by the bare regex "3A".
# Use ".*3A.*" so the regex spans the full "3A — Triple Axel" label. Each
# variant row is a single Compose Text node (code + em-dash + localized name),
# so this hits exactly the "3A" variant.
- assertVisible: ".*3A.*"
- tapOn: ".*3A.*"
# --- ISU element-selection proof ends here ---
# The steps above complete the ISU vocabulary migration verification: the family-grouped
# picker renders, "Axel" header is visible, the swipe reveals the rotation variants, and
# "3A — Triple Axel" is asserted + tapped (radio selection). This is the Task 10 proof.
#
# The remaining pipeline (tap "Next" → "Uploading video…" → "Analysis complete") is blocked
# by a picker-layout bug downstream of the migration: the ModalBottomSheet's Column has no
# verticalScroll modifier, so the confirm "Next" button (after ~26 catalog rows) is clipped
# off the bottom of the sheet and unreachable via Maestro swipes. The flow is intentionally
# truncated here until the picker gets a scrollable container (separate task).
