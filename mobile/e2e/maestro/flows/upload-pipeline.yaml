appId: ru.skatelab.capture
tags:
  - upload
  - e2e
  - pipeline
---
# Full upload pipeline: addMedia → pick video → element selection → upload → processing → completed
# Prerequisites: logged in, backend processing pipeline running
- addMedia: ["./assets/test_video.mp4"]
- launchApp
- assertVisible: "Camera"
- tapOn: "Upload video"
- runFlow: ../partials/pick_first_video.yaml
# Element type selection (if shown)
- assertVisible: "axel"
- tapOn: "axel"
# Processing screen should appear
- assertVisible: "Uploading video…"
- retry:
    maxRetries: 30
    commands:
      - assertVisible: "Analysis complete"