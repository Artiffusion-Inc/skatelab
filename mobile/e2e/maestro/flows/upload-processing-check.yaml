appId: ru.skatelab.capture
tags:
  - smokeTest
  - upload
  - processing
---
# Upload queue + processing screen check
# Verifies empty states and navigation to upload queue
- launchApp
- extendedWaitUntil:
    visible: "Camera"
    timeout: 15000

# Check Progress tab empty state (no sessions)
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "No active processing"
    timeout: 5000

# Check Sessions tab empty state
- tapOn: "Sessions"
- extendedWaitUntil:
    visible: "No sessions yet"
    timeout: 5000

# Navigate to Uploads via Profile
- tapOn: "Profile"
- scroll
- scroll
- tapOn: "Uploads"
- extendedWaitUntil:
    visible: "No uploads"
    timeout: 5000
- assertVisible: "Videos you upload"