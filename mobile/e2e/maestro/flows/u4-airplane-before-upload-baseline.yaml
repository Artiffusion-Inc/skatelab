appId: ru.skatelab.capture
tags:
  - bug-hunt
  - upload
---
# U4 baseline: login online → airplane ON → upload attempt → "No connection"/"Retry" → airplane OFF → retry → complete.
# Requires en-US locale: adb shell service call locale 3 s16 ru.skatelab.capture s16 en-US
- addMedia: ["./assets/test_video.mp4"]
- launchApp
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - assertVisible: "Log in to your account"
- assertVisible: "Log in to your account"
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
- assertVisible: "Camera"
# Go offline, then walk the upload flow up to upload-init (network call after element selection)
- setAirplaneMode: enabled
- tapOn: "Upload video"
- tapOn: "00:12"
# ISU element picker (family-grouped): "Axel" family header, swipe to variants, tap "3A"
- assertVisible: "Axel"
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 500
- assertVisible: ".*3A.*"
- tapOn: ".*3A.*"
- tapOn: "Next"
# upload-init (network) fails offline → UploadWorker sets NETWORK_ERROR →
# ProcessingScreen shows "No connection"/"Retry" within ~15s (connectTimeout 10s
# + no HttpRequestRetry on IOException → fast fail).
# extendedWaitUntil polls up to 60s for "No connection" to appear.
- extendedWaitUntil:
    visible: "No connection"
    timeout: 60000
- assertVisible: "Retry"
# Restore network and retry
- setAirplaneMode: disabled
- tapOn: "Retry"
# Wait for processing to complete (network restored)
- retry:
    maxRetries: 30
    commands:
      - assertVisible: "Analysis complete"