appId: ru.skatelab.capture
tags:
  - bug-hunt
  - upload
---
# U4 baseline: login online → airplane ON → upload attempt (pick video + select element) → "No connection"/"Retry" → airplane OFF → retry → complete.
# Control GREEN: confirms pre-upload retry path healthy. If RED = infra/basic retry broken.
# Requires en-US locale (Maestro selectors): adb shell service call locale 3 s16 ru.skatelab.capture s16 en-US
- addMedia: ["./assets/test_video.mp4"]
- launchApp
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Camera"
    commands:
      - tapOn: "Profile"
      - scroll
      - scroll
      - tapOn: "Log out"
      - assertVisible: "Log in to your account"
- assertVisible: "Log in to your account"
- tapOn: "Email"
- inputText: test@skatelab.ru
- back
- tapOn: "Password"
- inputText: Test123456
- back
- tapOn: "Log in"
- assertVisible: "Camera"
# Go offline, then walk the upload flow up to the network call (upload init happens after element selection)
- setAirplaneMode: enabled
- tapOn: "Upload video"
- tapOn: "00:12"
# ISU element picker (family-grouped): "Axel" family header, then rotation variant.
- assertVisible: "Axel"
- swipe:
    start: 50%, 65%
    end: 50%, 45%
    duration: 500
- assertVisible: ".*3A.*"
- tapOn: ".*3A.*"
- tapOn: "Next"
# upload init (network) should now fail offline → offline handling
# Bounded by ChunkedUploader 30s timeout + WorkManager startup overhead; allow up to 60s.
- retry:
    maxRetries: 60
    interval: 1000
    commands:
      - assertVisible: "No connection"
- assertVisible: "Retry"
# Restore network and retry
- setAirplaneMode: disabled
- tapOn: "Retry"
# Wait for processing to complete (network restored)
- retry:
    maxRetries: 30
    interval: 1000
    commands:
      - assertVisible: "Analysis complete"