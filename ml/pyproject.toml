[project]
name = "ml"
version = "0.1.0"
description = "SkateLab ML pipeline — pose estimation, biomechanics, recommendations"
requires-python = ">=3.11"
dependencies = [
    "onnxruntime-gpu>=1.24.4",  # ONNX Runtime with CUDA backend for MogaNet-B
    "nvidia-ml-py>=13.0.0",     # NVIDIA GPU management via NVML (replaces pynvml)
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "numba>=0.60.0",
    "dtw-python>=1.5.0",
    "scipy>=1.14.0",
    "pillow>=12.1.1",
    "deep-sort-realtime>=1.3.2",
    "av>=17.0.0",
    "trimesh>=4.11.5",
    "pygltflib>=1.16.5",
    "aiobotocore>=3.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "scikit-learn>=1.8.0",
    "mmengine>=0.10.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "fastapi>=0.136.1",
    "pytest-asyncio>=1.3.0",
]
