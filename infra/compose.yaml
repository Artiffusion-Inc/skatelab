name: infra

services:
  valkey:
    image: docker.io/valkey/valkey:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - valkey-data:/data
    networks:
      - infra

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-src}
      POSTGRES_USER: ${POSTGRES_USER:-skatelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skatelab} -d ${POSTGRES_DB:-src}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - infra

  # ── 9router (AI gateway / proxy) ────────────────────────────────
  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      PORT: "20128"
      DATA_DIR: /app/data
    volumes:
      - ./services/9router/data:/app/data
    networks:
      - infra

  # ── vless-sub (proxy subscription aggregator) ──────────────────
  vless-sub:
    image: docker.io/xpos587/vless-sub-server:latest
    restart: unless-stopped
    environment:
      HWID: ${HWID}
      PORT: "8080"
      SUBSCRIPTION_URLS: "${VLESS_SUB_URLS}"
      REFRESH_INTERVAL: "30m"
      GEO_DAT_DIR: /usr/local/share/xray
      MAX_CONCURRENT: "50"
      DNS_CACHE_TTL: "10m"
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: "50m"
    networks:
      - infra

volumes:
  valkey-data:
  postgres-data:

networks:
  infra:
    name: infra_app_network
    external: true