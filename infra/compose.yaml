name: infra

services:
  valkey:
    image: docker.io/valkey/valkey:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - valkey-data:/data
    networks:
      - infra

  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-src}
      POSTGRES_USER: ${POSTGRES_USER:-skatelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skatelab} -d ${POSTGRES_DB:-src}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - infra

  # ── PostHog ──────────────────────────────────────────────────────
  # Shared infra: Valkey DB 2, RustFS S3, infra_app_network
  # Service names resolve via Docker DNS on infra_app_network

  posthog-db:
    image: docker.io/library/postgres:15.12-alpine
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: ${POSTHOG_POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog -d posthog"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - posthog-pg-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - infra

  posthog_clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.3.10.60
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - posthog-clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/custom.xml:/etc/clickhouse-server/config.d/custom.xml:ro
    deploy:
      resources:
        limits:
          memory: 5g
    networks:
      - infra

  posthog_kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    profiles: ["posthog"]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - developer
      - --smp
      - "2"
      - --memory
      - 3G
      - --reserve-memory
      - 500M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - "PLAINTEXT://0.0.0.0:9092"
      - --advertise-kafka-addr
      - "PLAINTEXT://posthog_kafka:9092"
      - --schema-registry-addr
      - "http://0.0.0.0:8081"
      - --rpc-addr
      - "0.0.0.0:33145"
      - --advertise-rpc-addr
      - "posthog_kafka:33145"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - posthog-kafka-data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          memory: 4g
    networks:
      - infra

  posthog_kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    profiles: ["posthog"]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        TIMEOUT=60; ELAPSED=0
        until rpk topic list --brokers posthog_kafka:9092 2>/dev/null; do
          sleep 2; ELAPSED=$((ELAPSED + 2))
          [ $ELAPSED -ge $TIMEOUT ] && exit 1
        done
        for topic in clickhouse_events_json; do
          rpk topic create "$$topic" --brokers posthog_kafka:9092 -p 1 -r 1 2>&1 || \
            rpk topic list --brokers posthog_kafka:9092 | grep -q "$$topic" && echo "exists" || exit 1
        done
    depends_on:
      posthog_kafka:
        condition: service_healthy
    networks:
      - infra

  posthog_web:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      SITE_URL: https://ph.${DOMAIN:-skatelab.ru}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?required}
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      CLICKHOUSE_HOST: http://posthog_clickhouse:8123
      KAFKA_HOSTS: posthog_kafka:9092
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: http://infra-rustfs-1:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      OBJECT_STORAGE_BUCKET_URL_TEMPLATE: https://s3.${DOMAIN:-skatelab.ru}/posthog
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      RECORDING_API_URL: http://posthog_recording-api:6738
      PERSONHOG_ADDR: posthog_personhog-router:50052
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      DEPLOYMENT: hobby
      OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog_clickhouse:
        condition: service_started
      posthog_kafka:
        condition: service_healthy
      posthog_personhog-router:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - infra

  posthog_worker:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      SITE_URL: https://ph.${DOMAIN:-skatelab.ru}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?required}
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      CLICKHOUSE_HOST: http://posthog_clickhouse:8123
      KAFKA_HOSTS: posthog_kafka:9092
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: http://infra-rustfs-1:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      RECORDING_API_URL: http://posthog_recording-api:6738
      PERSONHOG_ADDR: posthog_personhog-router:50052
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      DEPLOYMENT: hobby
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog_clickhouse:
        condition: service_started
      posthog_kafka:
        condition: service_healthy
      posthog_web:
        condition: service_started
      posthog_personhog-router:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - infra

  posthog_plugins:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      SITE_URL: https://ph.${DOMAIN:-skatelab.ru}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?required}
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      CDP_REDIS_HOST: infra-valkey-1
      CDP_REDIS_PORT: "6379"
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: http://infra-rustfs-1:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog_clickhouse:
        condition: service_started
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - infra

  posthog_capture:
    image: ghcr.io/posthog/posthog/capture:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      ADDRESS: ":3000"
      KAFKA_TOPIC: events_plugin_ingestion
      KAFKA_HOSTS: posthog_kafka:9092
      CAPTURE_MODE: events
      REDIS_URL: redis://infra-valkey-1:6379/2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_replay-capture:
    image: ghcr.io/posthog/posthog/capture:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      ADDRESS: ":3000"
      KAFKA_TOPIC: session_recording_snapshot_item_events
      KAFKA_HOSTS: posthog_kafka:9092
      CAPTURE_MODE: recordings
      REDIS_URL: redis://infra-valkey-1:6379/2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/_readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_feature-flags:
    image: ghcr.io/posthog/posthog/feature-flags:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      ADDRESS: ":3001"
      READ_DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      WRITE_DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/_readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_personhog-replica:
    image: ghcr.io/posthog/posthog/personhog-replica:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      PRIMARY_DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      METRICS_PORT: "9100"
    depends_on:
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_personhog-router:
    image: ghcr.io/posthog/posthog/personhog-router:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      REPLICA_URL: http://posthog_personhog-replica:50051
      METRICS_PORT: "9101"
    depends_on:
      - posthog_personhog-replica
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_property-defs-rs:
    image: ghcr.io/posthog/posthog/property-defs-rs:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      KAFKA_HOSTS: posthog_kafka:9092
      FILTER_MODE: opt-out
      REDIS_URL: redis://infra-valkey-1:6379/2
    depends_on:
      posthog_kafka-init:
        condition: service_completed_successfully
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_cyclotron-janitor:
    image: ghcr.io/posthog/posthog/cyclotron-janitor:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      KAFKA_HOSTS: posthog_kafka:9092
      KAFKA_TOPIC: clickhouse_app_metrics2
      REDIS_URL: redis://infra-valkey-1:6379/2
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog_kafka:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_hypercache-server:
    image: ghcr.io/posthog/posthog/hypercache-server:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      ADDRESS: ":3002"
      REDIS_URL: redis://infra-valkey-1:6379/2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/_readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_cymbal:
    image: ghcr.io/posthog/posthog/cymbal:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      KAFKA_HOSTS: posthog_kafka:9092
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      OBJECT_STORAGE_ENDPOINT: http://infra-rustfs-1:9000
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "3302"
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      PERSONS_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      RUST_LOG: info
    depends_on:
      posthog_kafka-init:
        condition: service_completed_successfully
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_ingestion-general:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      PERSONS_DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_ingestion-sessionreplay:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      SESSION_RECORDING_V2_S3_TIMEOUT_MS: "120000"
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_ingestion-error-tracking:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_ingestion-logs:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
    depends_on:
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_ingestion-traces:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
    depends_on:
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_recording-api:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog-node:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

  posthog_temporal:
    image: docker.io/temporalio/auto-setup:1.26.2
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      - DB=postgres12
      - DB_HOST=posthog-db
      - DB_PORT=5432
      - DB_NAME=posthog
      - DB_USER=posthog
      - DB_PASSWORD=${POSTHOG_POSTGRES_PASSWORD}
      - ENABLE_ES=false
      - TEMPORAL_ADDRESS=posthog_temporal:7233
    depends_on:
      posthog-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - infra

  posthog_temporal-django-worker:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    command: ./bin/temporal-django-worker
    environment:
      SITE_URL: https://ph.${DOMAIN:-skatelab.ru}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?required}
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      REDIS_URL: redis://infra-valkey-1:6379/2
      KAFKA_HOSTS: posthog_kafka:9092
      TEMPORAL_HOST: posthog_temporal:7233
      OBJECT_STORAGE_ENDPOINT: http://infra-rustfs-1:9000
      OBJECT_STORAGE_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      SESSION_RECORDING_V2_S3_ENDPOINT: http://infra-rustfs-1:9000
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      ENCRYPTION_SALT_KEYS: ${POSTHOG_ENCRYPTION_SALT_KEYS:-}
    depends_on:
      - posthog-db
      - posthog_temporal
      - posthog_kafka
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - infra

  posthog_livestream:
    image: ghcr.io/posthog/posthog/livestream:1.88.0
    profiles: ["posthog"]
    restart: unless-stopped
    environment:
      LIVESTREAM_JWT_SECRET: ${POSTHOG_SECRET_KEY}
    depends_on:
      posthog_kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - infra

  posthog_asyncmigrationscheck:
    image: us-docker.pkg.dev/posthog-prod/posthog-prod-server/posthog:1.88.0
    profiles: ["posthog"]
    restart: "no"
    environment:
      SITE_URL: https://ph.${DOMAIN:-skatelab.ru}
      SECRET_KEY: ${POSTHOG_SECRET_KEY:?required}
      DATABASE_URL: postgres://posthog:${POSTHOG_POSTGRES_PASSWORD}@posthog-db:5432/posthog
      SKIP_ASYNC_MIGRATIONS_SETUP: 0
    depends_on:
      posthog-db:
        condition: service_healthy
    networks:
      - infra

