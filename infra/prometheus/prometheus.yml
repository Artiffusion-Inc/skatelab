global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Load recording + alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # GPU worker
  - job_name: "gpu-worker"
    static_configs:
      - targets: ["gpu-worker:8000"]
    metrics_path: /metrics
    scheme: http

  # If running GPU worker on host instead of container:
  # - job_name: "gpu-worker-local"
  #   static_configs:
  #     - targets: ["host.docker.internal:8000"]

  # PostHog ClickHouse
  - job_name: "posthog_clickhouse"
    static_configs:
      - targets: ["posthog_clickhouse:8123"]

  # PostHog Redpanda
  - job_name: "posthog_kafka"
    static_configs:
      - targets: ["posthog_kafka:9644"]

  # PostHog web (Django) — /metrics endpoint (expected exporter endpoint)
  - job_name: "posthog_web"
    static_configs:
      - targets: ["posthog_web:8001"]
    metrics_path: /metrics
    scheme: http

  # PostHog worker (Celery) — exports posthog_celery_queue_length (expected exporter endpoint)
  - job_name: "posthog_worker"
    static_configs:
      - targets: ["posthog_worker:9001"]
    metrics_path: /metrics
    scheme: http
