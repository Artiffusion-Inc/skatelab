# SkateLab mobile API and background workers.
# Runtime secrets live in Dokploy; Traefik domain state lives in Dokploy Domains.
services:
  backend:
    image: ghcr.io/artiffusion-inc/skatelab-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL}
      VALKEY_URL: ${VALKEY_URL}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-skatelab-data}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VASTAI_API_KEY: ${VASTAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      APP_DATA_DIR: ${APP_DATA_DIR:-/app/data}
      APP_COOKIE_SECURE: "true"
      APP_COOKIE_DOMAIN: .skatelab.ru
      APP_SKIP_AUTH: "false"
      STAFF_EMAILS: ${STAFF_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - dokploy-network

  worker-heavy:
    image: ghcr.io/artiffusion-inc/skatelab-arq-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: ["arq", "app.worker.HeavyWorkerSettings"]
    environment: *backend-environment
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - dokploy-network

  worker-fast:
    image: ghcr.io/artiffusion-inc/skatelab-arq-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: ["arq", "app.worker.FastWorkerSettings"]
    environment: *backend-environment
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
