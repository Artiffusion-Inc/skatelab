# SkateLab Production — separate compose stack on dedic
# Deployed to /opt/skatelab/compose.yaml
# Shares infra postgres + valkey (same Docker network)
# Infra Caddy (separate stack) proxies skatelab.ru → these services

name: skatelab

services:
  backend:
    image: ghcr.io/artiffusion-inc/skatelab-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://skatelab:${POSTGRES_PASSWORD}@infra-postgres-1/skatelab
      VALKEY_URL: redis://infra-valkey-1:6379/3
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-skatelab-pipeline}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VASTAI_API_KEY: ${VASTAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://ph.skatelab.ru}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - infra

  frontend:
    image: ghcr.io/artiffusion-inc/skatelab-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://ph.skatelab.ru}
      POSTHOG_PERSONAL_API_KEY: ${POSTHOG_PERSONAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - infra

  prometheus:
    image: docker.io/prom/prometheus:v3.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

volumes:
  prometheus-data:

networks:
  infra:
    name: infra_app_network
    external: true