# SkateLab Production — separate compose stack on dedic
# Deployed to /opt/skatelab/compose.yaml
# Shares infra postgres + valkey (same Docker network)
# Infra Caddy (separate stack) proxies skatelab.ru → these services

name: skatelab

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-artiffusion-inc}/skatelab-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skatelab}:${POSTGRES_PASSWORD}@infra-postgres-1/${POSTGRES_DB:-skatelab}
      VALKEY_URL: redis://infra-valkey-1:6379/3
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      VASTAI_API_KEY: ${VASTAI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - infra

  frontend:
    image: ghcr.io/${GHCR_OWNER:-artiffusion-inc}/skatelab-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - infra

  prometheus:
    image: docker.io/prom/prometheus:v3.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - infra

volumes:
  prometheus-data:

networks:
  infra:
    name: infra_app_network
    external: true
