name: 'Setup Python + uv with sticky disk venv'
description: 'Install Python, uv, sync deps with .venv sticky disk (run after actions/checkout)'
inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.11'
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-python: true

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Mount venv sticky disk
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-venv-py${{ inputs.python-version }}
        path: .venv

    - name: Sync deps
      run: uv sync --all-packages --frozen --dev
      shell: bash
