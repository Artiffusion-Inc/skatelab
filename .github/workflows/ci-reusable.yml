name: CI (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: "3.11"
        type: string
      skip-docker:
        required: false
        default: false
        type: boolean
      run-all:
        required: false
        default: false
        type: boolean
    outputs:
      ci-passed:
        description: "Whether all CI checks passed"
        value: ${{ jobs.ci-passed.outputs.result }}

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ml: ${{ steps.filter.outputs.ml }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            python:
              - "backend/**"
              - "ml/src/**"
              - "ml/tests/**"
              - "pyproject.toml"
              - "backend/pyproject.toml"
              - "ml/pyproject.toml"
            ml:
              - "ml/**"
              - "pyproject.toml"
              - "ml/pyproject.toml"
            frontend:
              - "frontend/**"
            docker:
              - "backend/Containerfile"
              - "frontend/Containerfile"
              - ".containerignore"
              - "infra/**"
            design:
              - "DESIGN.md"
              - "scripts/design-*.js"
              - "tokens/lock.json"
              - "frontend/src/app/tokens.css"
              - "frontend/src/app/globals.css"
              - "mobile/androidApp/**/theme/**"
              - "mobile/iosApp/**/Theme/**"

  lint:
    name: Lint (ruff) + Alembic
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.python == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
        with:
          python-version: ${{ inputs.python-version }}
      - name: Ruff format
        run: uv run ruff format --check backend/ ml/
      - name: Ruff check
        run: uv run ruff check backend/ ml/ --output-format=github
      - name: Alembic single head
        run: |
          HEADS=$(cd backend && uv run alembic heads 2>&1 | grep -c '(head)')
          if [ "$HEADS" -ne 1 ]; then
            echo "::error::Alembic has $HEADS heads (expected 1). Run 'alembic merge' or fix revision IDs."
            cd backend && uv run alembic heads 2>&1
            exit 1
          fi

  typecheck:
    name: Type Check (basedpyright)
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.python == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
        with:
          python-version: ${{ inputs.python-version }}
      - name: basedpyright
        run: uv run basedpyright --level error backend/app

  ast-grep:
    name: Lint (ast-grep)
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ast-grep/action@v1.5.0
        with:
          config: sgconfig.yml
          paths: "backend/ ml/ frontend/"

  design-ci:
    name: Design Lint + Drift
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.design == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
      - name: Install impeccable
        run: npm install -g impeccable
      - name: Impeccable detect
        run: impeccable detect --json frontend/src/ 2>&1 | node scripts/impeccable-report.js
      - name: Ast-grep scan
        uses: ast-grep/action@v1.5.0
        with:
          config: sgconfig.yml
          paths: "frontend/"
      - name: Check for drift
        run: node scripts/design-lock.js check

  test:
    name: Tests
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.python == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
        with:
          python-version: ${{ inputs.python-version }}
      - name: pytest
        run: >
          uv run pytest backend/tests/
          ml/tests/test_device.py ml/tests/test_types.py ml/tests/test_gap_filling.py
          ml/tests/test_worker_metrics.py ml/tests/test_tracked_extraction.py
          ml/tests/test_projection.py ml/tests/test_pipeline_parallel.py
          ml/tests/alignment/ ml/tests/analysis/
          ml/tests/utils/test_gap_filling.py ml/tests/utils/test_geometry.py
          ml/tests/utils/test_geometry_numba.py ml/tests/utils/test_profiler.py
          ml/tests/utils/test_profiling.py ml/tests/utils/test_smoothing.py
          ml/tests/utils/test_smoothing_numba.py ml/tests/utils/test_video_writer_nvenc.py
          ml/tests/references/ ml/tests/pose_3d/ ml/tests/pose_estimation/ ml/tests/datasets/
          -n auto --dist loadfile
          -v -m "not slow and not integration"
          --cov=backend/app --cov=ml/src
          --cov-report=xml --junitxml=junit.xml --tb=short
      - name: Upload coverage (backend)
        if: always()
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: backend,ml
          name: python-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results (backend)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml

  smoke:
    name: Smoke Tests (ML inference)
    needs: [changes, test]
    if: inputs.run-all || needs.changes.outputs.ml == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-venv
        with:
          python-version: ${{ inputs.python-version }}
      - name: pytest smoke
        run: uv run pytest ml/tests/smoke/ -v -m smoke --tb=short

  fe-check:
    name: Check (Biome + tsc)
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-frontend
      - name: Biome check
        working-directory: frontend
        run: bunx biome check .
      - name: tsc
        working-directory: frontend
        run: bun run typecheck
      - name: React Doctor
        working-directory: frontend
        run: npx react-doctor@latest --diff origin/master --offline --verbose
        continue-on-error: true

  fe-build:
    name: Build (Next.js)
    needs: [changes, fe-check]
    if: inputs.run-all || needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
      - name: next build
        working-directory: frontend
        run: ANALYZE=true bun run build 2>&1 | tee build.log
      - name: Bundle sizes summary
        if: always()
        working-directory: frontend
        run: |
          echo "### Bundle Sizes" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '├|└|│' build.log >> "$GITHUB_STEP_SUMMARY" || echo "No bundle tree output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bundle analyzer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-analyzer
          path: frontend/.next/analyze/
          retention-days: 14

  fe-test:
    name: Tests (Vitest)
    needs: [changes]
    if: inputs.run-all || needs.changes.outputs.frontend == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
      - name: Vitest coverage
        working-directory: frontend
        run: bun run vitest run --coverage --reporter=junit --outputFile=test-report.junit.xml
      - name: Upload coverage (frontend)
        if: always()
        uses: codecov/codecov-action@v6
        with:
          directory: frontend/coverage
          flags: frontend
          name: frontend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results (frontend)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/test-report.junit.xml

  docker-backend:
    name: Docker Build (Backend)
    needs: [changes, test]
    if: ${{ !inputs.skip-docker && (inputs.run-all || needs.changes.outputs.docker == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build backend image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Containerfile
          push: false
          tags: skatelab-backend:ci

  docker-frontend:
    name: Docker Build (Frontend)
    needs: [changes, fe-check, fe-build]
    if: ${{ !inputs.skip-docker && (inputs.run-all || needs.changes.outputs.docker == 'true') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
      - name: Build frontend image
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend
          file: frontend/Containerfile
          push: false
          tags: skatelab-frontend:ci

  danger:
    name: Danger (PR checks)
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install danger-js
        run: npm install -g danger
      - name: Run Danger
        run: danger ci
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-passed:
    name: CI Summary
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [changes, lint, typecheck, ast-grep, design-ci, test, smoke, fe-check, fe-build, fe-test, docker-backend, docker-frontend, danger]
    if: always()
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Check results & write summary
        id: check
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          SMOKE: ${{ needs.smoke.result }}
          FE_CHECK: ${{ needs.fe-check.result }}
          FE_BUILD: ${{ needs.fe-build.result }}
          FE_TEST: ${{ needs.fe-test.result }}
          DOCKER_BACKEND: ${{ needs.docker-backend.result }}
          DOCKER_FRONTEND: ${{ needs.docker-frontend.result }}
          AST_GREP: ${{ needs.ast-grep.result }}
          DESIGN_CI: ${{ needs.design-ci.result }}
          DANGER: ${{ needs.danger.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          FAILED=0

          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"

          check_job() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "| :white_check_mark: ${name} | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| :x: ${name} | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          }

          check_job "Lint (ruff) + Alembic" "$LINT"
          check_job "Type Check (basedpyright)" "$TYPECHECK"
          check_job "Tests" "$TEST"
          check_job "Smoke Tests" "$SMOKE"
          check_job "Check (Biome + tsc)" "$FE_CHECK"
          check_job "Build (Next.js)" "$FE_BUILD"
          check_job "Tests (Vitest)" "$FE_TEST"
          check_job "Docker Build (Backend)" "$DOCKER_BACKEND"
          check_job "Docker Build (Frontend)" "$DOCKER_FRONTEND"
          echo "| :information_source: Danger (PR checks) | \`${DANGER}\` (informational) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :mag: ast-grep | \`${AST_GREP}\` (informational) |" >> "$GITHUB_STEP_SUMMARY"
          check_job "Design Lint + Drift" "$DESIGN_CI"

          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::changes detection failed"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "::error::CI failed"
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "### :x: CI Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "result=success" >> "$GITHUB_OUTPUT"
          echo "### :white_check_mark: All CI checks passed" >> "$GITHUB_STEP_SUMMARY"