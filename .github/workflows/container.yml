name: Container (GPU Worker)

on:
  push:
    branches: [master]
    paths:
      - ml/gpu_server/Containerfile
      - .containerignore
      - ml/**
      - Taskfile.yml
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & Push GPU Worker
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate pre-signed S3 URLs for models
        id: presign
        run: |
          uv run --no-project --isolated --with 'boto3==1.42.91' \
            python ml/scripts/generate_model_presigned_urls.py --output /tmp/model_urls.json
          echo "moganet_url=$(jq -r .moganet /tmp/model_urls.json)" >> "$GITHUB_OUTPUT"
          echo "rf_detr_url=$(jq -r .rf_detr /tmp/model_urls.json)" >> "$GITHUB_OUTPUT"
          echo "tcpformer_url=$(jq -r .tcpformer /tmp/model_urls.json)" >> "$GITHUB_OUTPUT"
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PATH_STYLE: "true"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/gpu_server/Containerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:${{ github.sha }}
          secrets: |
            moganet_url=${{ steps.presign.outputs.moganet_url }}
            rf_detr_url=${{ steps.presign.outputs.rf_detr_url }}
            tcpformer_url=${{ steps.presign.outputs.tcpformer_url }}

      - name: Build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## GPU Worker Build

          | Metric | Value |
          |--------|-------|
          | Status | `${{ steps.build.outcome }}` |
          | Image | `ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:${{ github.sha }}` |

          EOF