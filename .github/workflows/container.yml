name: Container (GPU Worker)

on:
  push:
    branches: [master]
    paths:
      - ml/gpu_server/Containerfile
      - .containerignore
      - ml/**
      - Taskfile.yml
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & Push GPU Worker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/gpu_server/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:${{ github.sha }}

      - name: Build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## GPU Worker Build

          | Metric | Value |
          |--------|-------|
          | Status | `${{ steps.build.outcome }}` |
          | Image | `ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-worker:${{ github.sha }}` |

          EOF
