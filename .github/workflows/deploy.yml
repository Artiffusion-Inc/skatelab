name: Deploy

# The public website is deployed separately through Dokploy.
# API/workers deploy manually; Dokploy owns their domain and runtime secrets.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      python-version: "3.11"
      skip-docker: true
      run-all: true
    secrets: inherit

  build-frontend:
    name: Build Frontend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Frontend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend
          file: frontend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:latest
          cache-to: type=inline

      - name: Frontend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Frontend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}\` |

          EOF

  build-backend:
    name: Build Backend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Backend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:latest
          cache-to: type=inline

      - name: Backend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}\` |

          EOF

  build-arq-worker:
    name: Build ARQ Worker Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push ARQ Worker
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Containerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-arq-worker:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-arq-worker:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-arq-worker:latest
          cache-to: type=inline

      - name: ARQ Worker build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ARQ Worker Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-arq-worker:${{ github.sha }}\` |

          EOF

  deploy:
    name: Trigger Dokploy Redeploy
    needs: [build-frontend, build-backend, build-arq-worker]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Trigger Dokploy compose.deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          envs: DOKPLOY_API_KEY,DOKPLOY_COMPOSE_ID
          script: |
            set -eu
            # Native Dokploy Domains preserve the website and unrelated routes.
            curl --fail-with-body --silent --show-error --max-time 30 \
              -X POST http://127.0.0.1:3000/api/compose.deploy \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" '{composeId: $id}')"
            for i in $(seq 1 60); do
              STATUS=$(curl --fail-with-body --silent --show-error --max-time 10 \
                "http://127.0.0.1:3000/api/deployment.allByCompose?composeId=$DOKPLOY_COMPOSE_ID" \
                -H "x-api-key: $DOKPLOY_API_KEY" | jq -r '.[0].status // "pending"')
              case "$STATUS" in
                done) exit 0 ;;
                error) echo "Dokploy deployment failed" >&2; exit 1 ;;
              esac
              sleep 5
            done
            echo "Dokploy deployment timed out" >&2
            exit 1

      - name: Verify public API and frontend health
        run: bash infra/dokploy/scripts/health-check-poll.sh 120 5

      - name: Deploy summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Path:** GHCR push → local Dokploy \`compose.deploy\` API → \`docker compose up -d --pull always\`

          EOF

  deploy-summary:
    name: Pipeline Summary
    needs: [ci, build-frontend, build-backend, build-arq-worker, deploy]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Pipeline Overview

          | Stage | Status |
          |-------|--------|
          | CI | \`${{ needs.ci.result }}\` |
          | Build Frontend | \`${{ needs.build-frontend.result }}\` |
          | Build Backend | \`${{ needs.build-backend.result }}\` |
          | Build ARQ Worker | \`${{ needs.build-arq-worker.result }}\` |
          | Deploy | \`${{ needs.deploy.result }}\` |

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Branch:** \`${{ github.ref_name }}\`

          EOF

          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "::error::Deploy pipeline failed"
            exit 1
          fi
