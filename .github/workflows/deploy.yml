name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "ml/gpu_server/**"
      - ".github/workflows/container.yml"
      - "docs/**"
      - "research/**"
      - "experiments/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: read

# Post-Dokploy: CI stays on PRs (branch protection enforces). Image builds decoupled
# from CI — they only need checkout + docker login. Final deploy is Dokploy watchtower
# auto-pull on :latest tag (no SSH). Critical path ~7-10 min (was ~17-25 min).
# Legacy SSH deploy preserved at deploy.yml.legacy-pre-dokploy (30-day archive).
jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      python-version: "3.11"
      skip-docker: true
      run-all: true
    secrets: inherit

  build-images:
    name: Build ${{ matrix.image }}
    # No needs:ci — builds don't depend on test results. Branch protection
    # enforces CI on PRs; here builds run in parallel with CI to shorten critical path.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: frontend
            dockerfile: frontend/Containerfile
            tag: skatelab-frontend
          - image: backend
            context: .
            dockerfile: backend/Containerfile
            tag: skatelab-backend
          - image: arq-worker
            context: .
            dockerfile: backend/Containerfile.worker
            tag: skatelab-arq-worker
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push ${{ matrix.image }}
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.tag }}:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.tag }}:${{ github.sha }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.tag }}:latest
          cache-to: type=gha,mode=max

      - name: Build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## ${{ matrix.image }} Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.tag }}:${{ github.sha }}\` |

          EOF

  # Gate: production safety check. Deploy itself is now Dokploy watchtower auto-pull
  # (no SSH job). This job exists so branch protection can require both CI + builds
  # green before a push to master is considered "deployed". Dokploy polls GHCR for
  # :latest and rolls automatically.
  deploy-gate:
    name: Deploy Gate (CI + builds green)
    needs: [ci, build-images]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Check gates
        run: |
          echo "ci: ${{ needs.ci.result }}"
          echo "build-images: ${{ needs.build-images.result }}"
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "::error::CI failed — deploy blocked"
            exit 1
          fi
          if [[ "${{ needs.build-images.result }}" != "success" ]]; then
            echo "::error::Image builds failed — deploy blocked"
            exit 1
          fi
          echo "All gates green. Dokploy watchtower will auto-pull :latest."

  deploy-summary:
    name: Pipeline Summary
    needs: [ci, build-images, deploy-gate]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Pipeline Overview

          | Stage | Status |
          |-------|--------|
          | CI | \`${{ needs.ci.result }}\` |
          | Build Images | \`${{ needs.build-images.result }}\` |
          | Deploy Gate | \`${{ needs.deploy-gate.result }}\` |

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Branch:** \`${{ github.ref_name }}\`
          **Deploy:** Dokploy watchtower auto-pulls \`ghcr.io/.../:latest\` on success.

          EOF

          if [[ "${{ needs.build-images.result }}" != "success" ]]; then
            echo "::error::Build pipeline failed"
            exit 1
          fi