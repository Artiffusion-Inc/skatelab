name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "ml/gpu_server/**"
      - ".github/workflows/container.yml"
      - "docs/**"
      - "research/**"
      - "experiments/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      python-version: "3.11"
      skip-docker: true
      run-all: true
    secrets: inherit

  build-frontend:
    name: Build Frontend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Frontend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend
          file: frontend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}

      - name: Frontend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Frontend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}\` |

          EOF

  build-backend:
    name: Build Backend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Backend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}

      - name: Backend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}\` |

          EOF

  deploy:
    name: Deploy to VPS
    needs: [build-frontend, build-backend]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare deploy files
        id: prepare
        run: |
          cat > deploy.sh <<'SCRIPTEOF'
          #!/usr/bin/env bash
          set -e
          set -a
          source /opt/skatelab/.env
          set +a
          /usr/bin/docker network create infra_app_network 2>/dev/null || true
          echo "$GHCR_PAT" | /usr/bin/docker login ghcr.io -u "$GHCR_OWNER" --password-stdin
          cp /opt/skatelab/compose.prod.yaml /opt/skatelab/compose.yaml
          cd /opt/skatelab
          /usr/bin/docker compose pull backend frontend
          /usr/bin/docker compose up -d --remove-orphans
          SCRIPTEOF

          DEPLOY_B64=$(base64 -w0 deploy.sh)
          echo "deploy_b64=$DEPLOY_B64" >> "$GITHUB_OUTPUT"

          ENV_B64=$(printf 'GHCR_OWNER=%s\nGHCR_PAT=%s\nTAG=%s\nPOSTGRES_PASSWORD=%s\nR2_ENDPOINT_URL=%s\nR2_ACCESS_KEY_ID=%s\nR2_SECRET_ACCESS_KEY=%s\nR2_BUCKET=%s\nJWT_SECRET=%s\nVASTAI_API_KEY=%s\nRESEND_API_KEY=%s\n' \
            "${{ steps.ghcr.outputs.owner }}" "${{ secrets.GHCR_PAT }}" "${{ github.sha }}" "${{ secrets.SKATELAB_DB_PASSWORD }}" \
            "${{ secrets.CF_R2_ENDPOINT_URL }}" "${{ secrets.CF_R2_ACCESS_KEY_ID }}" "${{ secrets.CF_R2_SECRET_ACCESS_KEY }}" \
            "${{ secrets.CF_R2_BUCKET }}" "${{ secrets.JWT_SECRET }}" "${{ secrets.VASTAI_API_KEY }}" "${{ secrets.RESEND_API_KEY }}" | base64 -w0)
          echo "env_b64=$ENV_B64" >> "$GITHUB_OUTPUT"

          COMPOSE_B64=$(base64 -w0 infra/compose.prod.yaml)
          echo "compose_b64=$COMPOSE_B64" >> "$GITHUB_OUTPUT"

          CADDY_B64=$(base64 -w0 infra/Caddyfile)
          echo "caddy_b64=$CADDY_B64" >> "$GITHUB_OUTPUT"

          PROM_B64=$(base64 -w0 infra/prometheus.yml)
          echo "prom_b64=$PROM_B64" >> "$GITHUB_OUTPUT"

          ALERTS_B64=$(base64 -w0 infra/prometheus/rules/alerts.yml)
          echo "alerts_b64=$ALERTS_B64" >> "$GITHUB_OUTPUT"

          RECORDING_B64=$(base64 -w0 infra/prometheus/rules/recording.yml)
          echo "recording_b64=$RECORDING_B64" >> "$GITHUB_OUTPUT"

      - name: Write all files to VPS
        id: sync
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          request_pty: true
          script: |
            mkdir -p /opt/skatelab/prometheus/rules
            echo '${{ steps.prepare.outputs.deploy_b64 }}' | base64 -d > /opt/skatelab/deploy.sh
            chmod +x /opt/skatelab/deploy.sh
            echo '${{ steps.prepare.outputs.env_b64 }}' | base64 -d > /opt/skatelab/.env
            echo '${{ steps.prepare.outputs.compose_b64 }}' | base64 -d > /opt/skatelab/compose.prod.yaml
            echo '${{ steps.prepare.outputs.caddy_b64 }}' | base64 -d > /opt/skatelab/Caddyfile
            echo '${{ steps.prepare.outputs.prom_b64 }}' | base64 -d > /opt/skatelab/prometheus.yml
            echo '${{ steps.prepare.outputs.alerts_b64 }}' | base64 -d > /opt/skatelab/prometheus/rules/alerts.yml
            echo '${{ steps.prepare.outputs.recording_b64 }}' | base64 -d > /opt/skatelab/prometheus/rules/recording.yml

      - name: Deploy skatelab stack
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          request_pty: true
          script: |
            bash /opt/skatelab/deploy.sh

      - name: Add Caddy route for skatelab.ru
        id: caddy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          request_pty: true
          script: |
            grep -q "^skatelab.ru " /opt/infra/services/caddy/Caddyfile && exit 0
            cat /opt/skatelab/Caddyfile >> /opt/infra/services/caddy/Caddyfile
            /usr/bin/docker exec infra-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Run database migrations
        id: migrate
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          request_pty: true
          script: |
            sleep 10
            /usr/bin/docker exec skatelab-backend-1 alembic upgrade head

      - name: Health check
        id: health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          request_pty: true
          script: |
            timeout 120 bash -c 'while true; do /usr/bin/docker exec skatelab-backend-1 python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\", timeout=2)" 2>/dev/null && echo "Backend healthy" && exit 0; sleep 10; done'

      - name: Cleanup
        id: cleanup
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          request_pty: true
          script: /usr/bin/docker image prune -f --filter "until=24h" || true

      - name: Deploy summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          | Step | Status |
          |------|--------|
          | Write files to VPS | \`${{ steps.sync.outcome }}\` |
          | Docker compose up | \`${{ steps.deploy.outcome }}\` |
          | Caddy route | \`${{ steps.caddy.outcome }}\` |
          | Migrations | \`${{ steps.migrate.outcome }}\` |
          | Health check | \`${{ steps.health.outcome }}\` |
          | Cleanup | \`${{ steps.cleanup.outcome }}\` |

          EOF

  deploy-summary:
    name: Pipeline Summary
    needs: [ci, build-frontend, build-backend, deploy]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Pipeline Overview

          | Stage | Status |
          |-------|--------|
          | CI | \`${{ needs.ci.result }}\` |
          | Build Frontend | \`${{ needs.build-frontend.result }}\` |
          | Build Backend | \`${{ needs.build-backend.result }}\` |
          | Deploy | \`${{ needs.deploy.result }}\` |

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Branch:** \`${{ github.ref_name }}\`

          EOF

          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "::error::Deploy pipeline failed"
            exit 1
          fi
