name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "ml/gpu_server/**"
      - ".github/workflows/container.yml"
      - "docs/**"
      - "research/**"
      - "experiments/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      python-version: "3.11"
      skip-docker: true
      run-all: true
    secrets: inherit

  build-frontend:
    name: Build Frontend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Frontend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: frontend
          file: frontend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}

      - name: Frontend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Frontend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-frontend:${{ github.sha }}\` |

          EOF

  build-backend:
    name: Build Backend Image
    needs: ci
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push Backend
        id: build
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: backend/Containerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}

      - name: Backend build summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Backend Build

          | Metric | Value |
          |--------|-------|
          | Status | \`${{ steps.build.outcome }}\` |
          | Image | \`ghcr.io/${{ steps.ghcr.outputs.owner }}/skatelab-backend:${{ github.sha }}\` |

          EOF

  deploy:
    name: Deploy to VPS
    needs: [build-frontend, build-backend]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase GHCR owner
        id: ghcr
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Write .env and deploy script on runner
        run: |
          cat > infra/deploy.sh <<'SCRIPTEOF'
          #!/usr/bin/env bash
          set -e
          /usr/bin/docker network create infra_app_network 2>/dev/null || true
          cp /opt/skatelab/compose.prod.yaml /opt/skatelab/compose.yaml
          cd /opt/skatelab
          /usr/bin/docker compose pull backend frontend
          /usr/bin/docker compose up -d --remove-orphans
          SCRIPTEOF

          cat > infra/skatelab.env <<ENVEOF
          GHCR_OWNER=${{ steps.ghcr.outputs.owner }}
          TAG=${{ github.sha }}
          POSTGRES_PASSWORD=${{ secrets.SKATELAB_DB_PASSWORD }}
          R2_ENDPOINT_URL=${{ secrets.CF_R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID=${{ secrets.CF_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ secrets.CF_R2_BUCKET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          VASTAI_API_KEY=${{ secrets.VASTAI_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          ENVEOF

      - name: SCP deploy files to VPS
        id: sync
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/compose.prod.yaml,infra/Caddyfile,infra/prometheus.yml,infra/prometheus/rules/alerts.yml,infra/prometheus/rules/recording.yml,infra/deploy.sh,infra/skatelab.env"
          target: "/opt/skatelab/"
          strip_components: 1

      - name: Deploy skatelab stack
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          request_pty: true
          script: |
            mv /opt/skatelab/skatelab.env /opt/skatelab/.env
            bash /opt/skatelab/deploy.sh

      - name: Add Caddy route for skatelab.ru
        id: caddy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          request_pty: true
          script: |
            grep -q "^skatelab.ru " /opt/infra/services/caddy/Caddyfile && exit 0
            cat /opt/skatelab/Caddyfile >> /opt/infra/services/caddy/Caddyfile
            /usr/bin/docker exec infra-caddy-1 caddy reload --config /etc/caddy/Caddyfile

      - name: Run database migrations
        id: migrate
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          request_pty: true
          script: |
            sleep 10
            /usr/bin/docker exec skatelab-backend-1 alembic upgrade head

      - name: Health check
        id: health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          request_pty: true
          script: |
            timeout 120 bash -c 'while true; do /usr/bin/docker exec skatelab-backend-1 python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/v1/health\", timeout=2)" 2>/dev/null && echo "Backend healthy" && exit 0; sleep 10; done'

      - name: Cleanup
        id: cleanup
        if: always()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1m
          request_pty: true
          script: /usr/bin/docker image prune -f --filter "until=24h" || true

      - name: Deploy summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Deploy

          | Step | Status |
          |------|--------|
          | Sync files | \`${{ steps.sync.outcome }}\` |
          | Docker compose up | \`${{ steps.deploy.outcome }}\` |
          | Caddy route | \`${{ steps.caddy.outcome }}\` |
          | Migrations | \`${{ steps.migrate.outcome }}\` |
          | Health check | \`${{ steps.health.outcome }}\` |
          | Cleanup | \`${{ steps.cleanup.outcome }}\` |

          EOF

  deploy-summary:
    name: Pipeline Summary
    needs: [ci, build-frontend, build-backend, deploy]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: always()
    steps:
      - name: Write summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Pipeline Overview

          | Stage | Status |
          |-------|--------|
          | CI | \`${{ needs.ci.result }}\` |
          | Build Frontend | \`${{ needs.build-frontend.result }}\` |
          | Build Backend | \`${{ needs.build-backend.result }}\` |
          | Deploy | \`${{ needs.deploy.result }}\` |

          **Commit:** \`${{ github.sha }}\`
          **Triggered by:** @${{ github.actor }}
          **Branch:** \`${{ github.ref_name }}\`

          EOF

          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            echo "::error::Deploy pipeline failed"
            exit 1
          fi
