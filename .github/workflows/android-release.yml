name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SKATELAB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          keytool_dir="$RUNNER_TEMP/skatelab-release"
          mkdir -p "$keytool_dir"
          chmod 700 "$keytool_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keytool_dir/release.keystore"
          chmod 600 "$keytool_dir/release.keystore"
          test -s "$keytool_dir/release.keystore"
          echo "SKATELAB_KEYSTORE_PATH=$keytool_dir/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          SKATELAB_KEYSTORE_PASSWORD: ${{ secrets.SKATELAB_KEYSTORE_PASSWORD }}
          SKATELAB_KEY_ALIAS: ${{ secrets.SKATELAB_KEY_ALIAS }}
          SKATELAB_KEY_PASSWORD: ${{ secrets.SKATELAB_KEY_PASSWORD }}
        working-directory: mobile
        run: |
          set -euo pipefail
          test -n "$SKATELAB_KEYSTORE_PASSWORD"
          test -n "$SKATELAB_KEY_ALIAS"
          test -n "$SKATELAB_KEY_PASSWORD"
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            --no-daemon --max-workers=1

      - name: Verify and stage release artifacts
        working-directory: mobile
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          aab="androidApp/build/outputs/bundle/release/androidApp-release.aab"
          test -s "$apk"
          test -s "$aab"

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$apksigner"
          test -x "$aapt2"
          "$apksigner" verify "$apk" >/dev/null
          jarsigner -verify "$aab" >/dev/null 2>&1
          unzip -tq "$apk" >/dev/null
          unzip -tq "$aab" >/dev/null

          package_id="$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          test "$package_id" = "ru.skatelab.capture"

          output="$RUNNER_TEMP/skatelab-release-artifacts"
          rm -rf "$output"
          mkdir -p "$output"
          cp "$apk" "$output/androidApp-release.apk"
          cp "$aab" "$output/androidApp-release.aab"
          (
            cd "$output"
            sha256sum androidApp-release.apk androidApp-release.aab > release-sha256.txt
            sha256sum -c release-sha256.txt >/dev/null
            {
              printf 'ref=%s\n' "$RELEASE_REF"
              printf 'commit=%s\n' "$RELEASE_COMMIT"
              printf 'package_id=%s\n' "$package_id"
              printf 'apk_signature=verified\n'
              printf 'aab_signature=verified\n'
              printf 'archives=verified\n'
              sha256sum androidApp-release.apk androidApp-release.aab
            } > release-verification.txt
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skatelab-android-${{ github.ref_name }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/skatelab-release-artifacts

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${SKATELAB_KEYSTORE_PATH:-}"
