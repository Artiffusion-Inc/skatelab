name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SKATELAB_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          keytool_dir="$RUNNER_TEMP/skatelab-release"
          mkdir -p "$keytool_dir"
          chmod 700 "$keytool_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keytool_dir/release.keystore"
          chmod 600 "$keytool_dir/release.keystore"
          test -s "$keytool_dir/release.keystore"
          echo "SKATELAB_KEYSTORE_PATH=$keytool_dir/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        env:
          SKATELAB_KEYSTORE_PASSWORD: ${{ secrets.SKATELAB_KEYSTORE_PASSWORD }}
          SKATELAB_KEY_ALIAS: ${{ secrets.SKATELAB_KEY_ALIAS }}
          SKATELAB_KEY_PASSWORD: ${{ secrets.SKATELAB_KEY_PASSWORD }}
        working-directory: mobile
        run: |
          set -euo pipefail
          test -n "$SKATELAB_KEYSTORE_PASSWORD"
          test -n "$SKATELAB_KEY_ALIAS"
          test -n "$SKATELAB_KEY_PASSWORD"
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease \
            --no-daemon --max-workers=1

      - name: Verify APK signature
        working-directory: mobile
        run: |
          set -euo pipefail
          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Write checksums
        working-directory: mobile
        run: |
          set -euo pipefail
          sha256sum \
            androidApp/build/outputs/apk/release/androidApp-release.apk \
            androidApp/build/outputs/bundle/release/androidApp-release.aab \
            > androidApp/build/outputs/release-sha256.txt
          cat androidApp/build/outputs/release-sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: skatelab-android-${{ github.ref_name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            mobile/androidApp/build/outputs/apk/release/androidApp-release.apk
            mobile/androidApp/build/outputs/bundle/release/androidApp-release.aab
            mobile/androidApp/build/outputs/release-sha256.txt

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${SKATELAB_KEYSTORE_PATH:-}"
