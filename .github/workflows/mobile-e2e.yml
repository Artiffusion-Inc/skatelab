name: Mobile E2E

on:
  workflow_run:
    workflows: [mobile-ci.yml]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Maestro E2E tests
    runs-on: macos-13
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6

      - name: Download APK from mobile-ci run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --name apk-debug --repo ${{ github.repository }} \
            ${{ github.event.workflow_run.id }} \
            -D androidApp/build/outputs/apk/debug || {
              echo "::error::No apk-debug artifact in the mobile-ci run."
              exit 1
            }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Boot Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: mobile

      - name: Install APK
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/debug -name '*.apk' | head -1)
          adb install "$APK_PATH"

      - name: Run Maestro tests
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.MAESTRO_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.MAESTRO_TEST_PASSWORD }}
          MAESTRO_TEST_DISPLAY_NAME: ${{ secrets.MAESTRO_TEST_DISPLAY_NAME }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test \
            --format junit \
            --format html \
            --output build/reports/maestro/ \
            ${{ github.event_name == 'workflow_run' && 'e2e/maestro/' || '--include-tags=smokeTest e2e/maestro/' }}

      - name: Disable airplane mode (cleanup)
        if: always()
        run: |
          adb shell settings put global airplane_mode_on 0
          adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state false

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: mobile/build/reports/maestro/

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: mobile/build/reports/maestro/report.xml
          require_tests: false